name: deploy

# Builds Dockerfile.serve and rolls it out to the Azure Container App
# running src/serve.py, whenever the serving code, the trained model
# artifact, or the serving image definition changes on master. Also
# runnable by hand from the Actions tab (workflow_dispatch) for the
# first manual deploy, or to redeploy without a code change.
#
# Auth is OIDC (azure/login@v2 with a federated credential) -- no Azure
# client secret is stored in GitHub at all. See infra/setup.sh for the
# one-time setup that registers the federated credential and the repo
# variables this workflow reads (vars.*, not secrets.*, since none of
# these identifiers are themselves sensitive).

on:
  push:
    branches: [master]
    paths:
      - "src/serve.py"
      - "src/parse.py"
      - "src/features.py"
      - "src/__init__.py"
      - "models/**"
      - "Dockerfile.serve"
      - "requirements-serve.txt"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  id-token: write   # required for OIDC federated login to Azure
  contents: read

concurrency:
  group: deploy-fourtop-serve
  cancel-in-progress: false

env:
  IMAGE_NAME: fourtop-serve

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure (OIDC, no stored secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Build and push serving image
        id: build
        run: |
          set -euo pipefail
          IMAGE="${{ vars.ACR_NAME }}.azurecr.io/${IMAGE_NAME}:${{ github.sha }}"
          LATEST="${{ vars.ACR_NAME }}.azurecr.io/${IMAGE_NAME}:latest"
          docker build -f Dockerfile.serve -t "$IMAGE" -t "$LATEST" .
          docker push "$IMAGE"
          docker push "$LATEST"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # A Container App must be CREATED with its private image and its
      # registry identity in the same request. Creating it on a public
      # placeholder (as main.bicep does) and updating it to an ACR image
      # afterwards does not work: Azure does not persist a registry entry for
      # a registry the current image does not come from, so the update fails
      # to pull, and repeated failed provisions leave the resource in a state
      # no further update can recover -- it has to be deleted and recreated.
      # So: update when the app already exists, create properly when it does
      # not. See the deployment notes in README.md.
      - name: Create or update the Container App
        run: |
          set -euo pipefail
          APP="${{ vars.CONTAINER_APP_NAME }}"
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          IMAGE="${{ steps.build.outputs.image }}"

          if az containerapp show --name "$APP" --resource-group "$RG" -o none 2>/dev/null; then
            echo "Container App exists -- updating image."
            az containerapp update --name "$APP" --resource-group "$RG" --image "$IMAGE"
          else
            echo "Container App does not exist -- creating it with the private image and its identity."
            IDENTITY_ID=$(az identity show --name "${APP}-identity" --resource-group "$RG" --query id -o tsv)
            ENV_ID=$(az containerapp env list --resource-group "$RG" --query "[0].id" -o tsv)
            az containerapp create \
              --name "$APP" \
              --resource-group "$RG" \
              --environment "$ENV_ID" \
              --user-assigned "$IDENTITY_ID" \
              --registry-identity "$IDENTITY_ID" \
              --registry-server "${{ vars.ACR_NAME }}.azurecr.io" \
              --image "$IMAGE" \
              --target-port 8000 \
              --ingress external \
              --min-replicas 0 \
              --max-replicas 2 \
              --cpu 0.5 --memory 1.0Gi
          fi

      - name: Smoke-test the deployed revision
        run: |
          set -euo pipefail
          FQDN=$(az containerapp show \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 10); do
            if curl -sf "https://${FQDN}/health"; then
              echo "Deployed revision is healthy at https://${FQDN}"
              exit 0
            fi
            echo "waiting for the new revision to become healthy (attempt $i/10)..."
            sleep 15
          done
          echo "New revision never became healthy" >&2
          exit 1
